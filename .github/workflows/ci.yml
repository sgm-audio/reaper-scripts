name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          fail=0
          for f in *.lua; do
            if ! lua5.4 -e "assert(loadfile('$f'))" 2>&1; then
              echo "SYNTAX ERROR: $f"
              fail=1
            fi
          done
          exit $fail

  lua-smoke:
    # Runs each script with a stubbed REAPER environment to catch
    # load-time crashes (undefined globals, nil arithmetic) that
    # a syntax check cannot find. Timeout = script waits on real
    # REAPER input under stubs -> SKIP, not a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua regression tests
        run: lua5.4 tests/lua_regression.lua
      - name: Smoke-run Lua scripts
        run: |
          fail=0
          for f in *.lua; do
            out=$(timeout 10 lua5.4 tests/lua_smoke.lua "$f" 2>&1); rc=$?
            if [ $rc -eq 0 ]; then
              echo "OK: $f: $out"
            elif [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
              echo "SKIP (waits on REAPER input under stubs): $f"
            else
              echo "RUNTIME ERROR ($rc): $f: $out"; fail=1
            fi
          done
          exit $fail

  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyflakes
        run: pip install pyflakes
      # RPR_* names are injected by the REAPER runtime, so they are expected
      # to be "undefined" to pyflakes outside REAPER.
      - name: Lint Python
        run: |
          out=$(python -m pyflakes *.py tests/*.py | grep -v "undefined name 'RPR_" || true)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
          echo "pyflakes clean"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Module tests
        run: python test_modules.py
      - name: Regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Suno workflow test suite
        run: python suno_workflow_comprehensive_test_suite.py
