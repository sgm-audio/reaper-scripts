name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.4 and luacheck
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck
      - name: Check Lua syntax and static lint
        run: |
          fail=0
          for f in *.lua; do
            if ! lua5.4 -e "assert(loadfile('$f'))" 2>&1; then
              echo "SYNTAX ERROR: $f"
              fail=1
            fi
          done
          luacheck *.lua tests/*.lua || fail=1
          exit $fail

  lua-smoke:
    # Runs each script with a stubbed REAPER environment to catch
    # load-time crashes (undefined globals, nil arithmetic) that
    # a syntax check cannot find. A timeout is a failure: a hung script
    # must not silently turn into a passing QA run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua regression tests
        run: |
          lua5.4 tests/lua_regression.lua
          lua5.4 tests/lua_api_contracts.lua
      - name: Smoke-run Lua scripts
        run: |
          fail=0
          for f in *.lua; do
            out=$(timeout 10 lua5.4 tests/lua_smoke.lua "$f" 2>&1); rc=$?
            if [ $rc -eq 0 ]; then
              echo "OK: $f: $out"
            else
              echo "RUNTIME ERROR ($rc): $f: $out"; fail=1
            fi
          done
          exit $fail

  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pyflakes
        run: pip install pyflakes
      # RPR_* names are injected by the REAPER runtime, so they are expected
      # to be "undefined" to pyflakes outside REAPER.
      - name: Lint Python
        run: |
          out=$(python -m pyflakes *.py tests/*.py SEMAS/*.py SEMAS/core/*.py | grep -v "undefined name 'RPR_" || true)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
          echo "pyflakes clean"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Module tests
        run: python test_modules.py
      - name: Regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Suno workflow test suite (23 tests, skips forbidden)
        run: python suno_workflow_comprehensive_test_suite.py

  lua-multi-os:
    name: Lua 5.4 regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - name: Syntax, regression, API contracts
        run: |
          for f in *.lua; do lua -e "assert(loadfile('$f'))" || exit 1; done
          lua tests/lua_regression.lua
          lua tests/lua_api_contracts.lua
      - name: Smoke
        run: |
          for f in *.lua; do lua tests/lua_smoke.lua "$f" || exit 1; done

  reaper-host:
    # Real REAPER 7.x (headless Xvfb): in-host Lua cases, Suno multi-format .rpp checks, and live AAF import via REAPER's Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install REAPER, Xvfb, and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 xz-utils libpython3-dev ffmpeg libavcodec-extra || sudo apt-get install -y xvfb libgtk-3-0 libasound2 xz-utils libpython3-dev ffmpeg libavcodec-extra
          curl -fsSL -o reaper.tar.xz https://www.reaper.fm/files/7.x/reaper786_linux_x86_64.tar.xz
          tar xf reaper.tar.xz
          pip install -r requirements.txt
      - name: Generate real WAV/MP3/FLAC/OGG/M4A Suno .rpp fixtures
        run: python tests/reaper_host/gen_suno_rpps.py "$PWD/suno-rpp-fixtures"
      - name: Live REAPER Lua cases + Suno multi-format .rpp checks
        run: SGM_SUNO_RPP_DIR="$PWD/suno-rpp-fixtures" SGM_HOST_ARTIFACTS=host-logs SGM_HOST_TIMEOUT=240 tests/reaper_host/run_host.sh "$PWD/reaper_linux_x86_64/REAPER"
      - name: Live REAPER AAF import (embedded Python)
        run: |
          LIBPY=$(python -c "import sysconfig,os;p=os.path.join(sysconfig.get_config_var('LIBDIR') or '',sysconfig.get_config_var('INSTSONAME') or '');print(p if p.endswith('.so') or '.so.' in p else '')")
          if [ -z "$LIBPY" ] || [ ! -f "$LIBPY" ]; then
            LIBPY=$(find /usr/lib/x86_64-linux-gnu -maxdepth 1 -name 'libpython3.*.so.1.0' | head -1)
          fi
          SP=$(python -c "import aaf2,os;print(os.path.dirname(os.path.dirname(aaf2.__file__)))")
          mkdir -p host-logs-aaf
          SGM_HOST_ARTIFACTS=host-logs-aaf SGM_SCRIPT="$PWD/tests/reaper_host/aaf_live.py" SGM_PYTHON_LIB="$LIBPY" \
            SGM_PYTHONPATH="$SP" SGM_HOST_TIMEOUT=240 tests/reaper_host/run_host.sh "$PWD/reaper_linux_x86_64/REAPER"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reaper-host-logs
          path: |
            host-logs
            host-logs-aaf

  real-demucs:
    # Runs the real htdemucs model on CPU. A missing backend or model download is a failure, not a skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU torch and demucs
        run: |
          pip install -r requirements.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install demucs
      - name: Real Demucs tests
        env:
          SGM_REAL_DEMUCS: "1"
        run: python -m unittest tests.test_demucs_real -v

  plugin-build:
    name: JUCE plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev
      - name: Configure pinned JUCE project
        run: |
          mkdir -p plugin/build
          set +e
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee plugin/build/configure.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### CMake configure failed (${{ matrix.os }})"
              echo '```text'
              tail -n 80 plugin/build/configure.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # GitHub keeps at most ten error annotations per step.
            tail -n 10 plugin/build/configure.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/}
              echo "::error::${line}"
            done
            exit "$status"
          fi
      - name: Build VST3, Standalone, and native tests
        run: cmake --build plugin/build --config Release
      - name: Run native processing tests
        run: |
          set +e
          ctest --test-dir plugin/build -C Release --output-on-failure 2>&1 | tee plugin/build/ctest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Native test failure (${{ matrix.os }})"
              echo '```text'
              cat plugin/build/Testing/Temporary/LastTest.log 2>/dev/null || cat plugin/build/ctest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 10 plugin/build/ctest.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/}
              echo "::error::${line}"
            done
            exit "$status"
          fi
      - name: Upload compiled Linux VST3 and Standalone artefacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sgm-utility-linux
          path: plugin/build/SGMUtility_artefacts

  reaper-juce-host:
    # Loads the compiled JUCE VST3 inside real REAPER 7.x and verifies Standalone launch under Xvfb.
    needs: plugin-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download compiled Linux VST3 and Standalone artefacts
        uses: actions/download-artifact@v8
        with:
          name: sgm-utility-linux
          path: vst3-dist
      - name: Install REAPER and runtime libraries
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 xz-utils libfreetype6 libfontconfig1 libgl1 || sudo apt-get install -y xvfb libgtk-3-0 libasound2 xz-utils libfreetype6 libfontconfig1 libgl1
          curl -fsSL -o reaper.tar.xz https://www.reaper.fm/files/7.x/reaper786_linux_x86_64.tar.xz
          tar xf reaper.tar.xz
      - name: Live REAPER 7.x JUCE VST3 host validation
        run: |
          VST3=$(find "$PWD/vst3-dist" -type d -name "SGM Utility.vst3" | head -n 1)
          echo "Found VST3 bundle: $VST3"
          [ -n "$VST3" ] && [ -d "$VST3" ] || { echo "SGM Utility.vst3 not found"; exit 1; }
          SGM_VST3_BUNDLE="$VST3" SGM_HOST_ARTIFACTS=host-logs-juce SGM_HOST_TIMEOUT=240 \
            tests/reaper_host/run_host.sh "$PWD/reaper_linux_x86_64/REAPER" juce_vst3_live
      - name: Live JUCE Standalone launch check
        run: |
          STANDALONE=$(find "$PWD/vst3-dist" -type f -name "SGM Utility" | head -n 1)
          echo "Found Standalone binary: $STANDALONE"
          [ -n "$STANDALONE" ] && [ -f "$STANDALONE" ] || { echo "SGM Utility Standalone not found"; exit 1; }
          chmod +x "$STANDALONE"
          xvfb-run -a "$STANDALONE" >standalone.log 2>&1 &
          PID=$!
          sleep 3
          kill -0 "$PID" || { echo "Standalone exited prematurely:"; cat standalone.log; exit 1; }
          echo "JUCE_STANDALONE_LAUNCH_OK pid=$PID"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reaper-juce-host-logs
          path: |
            host-logs-juce
            standalone.log
