name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          fail=0
          for f in *.lua; do
            if ! lua5.4 -e "assert(loadfile('$f'))" 2>&1; then
              echo "SYNTAX ERROR: $f"
              fail=1
            fi
          done
          exit $fail

  lua-smoke:
    # Runs each script with a stubbed REAPER environment to catch
    # load-time crashes (undefined globals, nil arithmetic) that
    # a syntax check cannot find. Timeout = script waits on real
    # REAPER input under stubs -> SKIP, not a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua regression tests
        run: lua5.4 tests/lua_regression.lua
      - name: Smoke-run Lua scripts
        run: |
          fail=0
          for f in *.lua; do
            out=$(timeout 10 lua5.4 tests/lua_smoke.lua "$f" 2>&1); rc=$?
            if [ $rc -eq 0 ]; then
              echo "OK: $f: $out"
            elif [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
              echo "SKIP (waits on REAPER input under stubs): $f"
            else
              echo "RUNTIME ERROR ($rc): $f: $out"; fail=1
            fi
          done
          exit $fail

  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyflakes
        run: pip install pyflakes
      # RPR_* names are injected by the REAPER runtime, so they are expected
      # to be "undefined" to pyflakes outside REAPER.
      - name: Lint Python
        run: |
          out=$(python -m pyflakes *.py tests/*.py SEMAS/*.py SEMAS/core/*.py | grep -v "undefined name 'RPR_" || true)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
          echo "pyflakes clean"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Module tests
        run: python test_modules.py
      - name: Regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Suno workflow test suite (23 tests, skips forbidden)
        run: python suno_workflow_comprehensive_test_suite.py

  plugin-build:
    name: JUCE plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev
      - name: Configure pinned JUCE project
        run: |
          mkdir -p plugin/build
          set +e
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee plugin/build/configure.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### CMake configure failed (${{ matrix.os }})"
              echo '```text'
              tail -n 80 plugin/build/configure.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # GitHub keeps at most ten error annotations per step.
            tail -n 10 plugin/build/configure.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/}
              echo "::error::${line}"
            done
            exit "$status"
          fi
      - name: Build VST3, Standalone, and native tests
        run: cmake --build plugin/build --config Release
      - name: Run native processing tests
        run: |
          set +e
          ctest --test-dir plugin/build -C Release --output-on-failure 2>&1 | tee plugin/build/ctest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Native test failure (${{ matrix.os }})"
              echo '```text'
              cat plugin/build/Testing/Temporary/LastTest.log 2>/dev/null || cat plugin/build/ctest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 10 plugin/build/ctest.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/}
              echo "::error::${line}"
            done
            exit "$status"
          fi
